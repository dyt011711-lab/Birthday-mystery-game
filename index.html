<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Secret Mission 💕</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  font-family:Arial, sans-serif;
  color:white;
  background:
    radial-gradient(circle at 50% 25%, rgba(139,30,110,.35), transparent 25%),
    radial-gradient(circle at 15% 50%, rgba(255,0,128,.18), transparent 25%),
    radial-gradient(circle at 90% 60%, rgba(120,30,255,.20), transparent 30%),
    #080510;
  overflow-x:hidden;
}

/* Background glow */

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 10% 20%, #ff3d9a 1px, transparent 2px),
    radial-gradient(circle at 80% 30%, #ff8ac5 1px, transparent 2px),
    radial-gradient(circle at 30% 70%, #a855f7 1px, transparent 2px),
    radial-gradient(circle at 70% 90%, #ff4fa3 1px, transparent 2px);
  background-size:150px 170px;
  opacity:.6;
  pointer-events:none;
}

/* Top text */

.top-text{
  text-align:center;
  padding-top:45px;
  font-size:12px;
  letter-spacing:7px;
  color:#ffd0e6;
}

.top-text span{
  color:#ff65ad;
  font-size:20px;
  margin:0 10px;
}

/* Main card */

.card{
  width:90%;
  max-width:460px;
  margin:70px auto 50px;
  padding:45px 25px;
  text-align:center;

  background:linear-gradient(
    180deg,
    rgba(62,8,48,.85),
    rgba(13,7,25,.92)
  );

  border:1px solid rgba(255,120,190,.7);
  border-radius:38px;

  box-shadow:
    0 0 30px rgba(255,0,130,.20),
    inset 0 0 40px rgba(255,50,160,.05);

  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  width:250px;
  height:250px;
  border-radius:50%;
  background:rgba(200,0,150,.16);
  filter:blur(50px);
  top:-120px;
  left:50%;
  transform:translateX(-50%);
}

/* Lock */

.lock-box{
  width:95px;
  height:95px;
  margin:0 auto 30px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;

  font-size:48px;

  background:rgba(255,0,150,.08);
  border:2px solid #ff55ad;

  box-shadow:
    0 0 20px #ff2f9a,
    0 0 50px rgba(255,0,160,.45);

  animation:float 3s ease-in-out infinite;

  position:relative;
  z-index:2;
}

@keyframes float{
  50%{
    transform:translateY(-10px);
  }
}

/* Title */

h1{
  font-size:48px;
  font-family:Georgia, serif;
  font-weight:500;
  margin-bottom:5px;
  position:relative;
}

.mission-title{
  font-family:cursive;
  font-size:52px;
  color:#ff5da8;
  margin-bottom:30px;
  text-shadow:0 0 20px rgba(255,60,160,.7);
}

/* Divider */

.divider{
  color:#ff79b8;
  margin-bottom:25px;
  font-size:18px;
}

/* Description */

.description{
  color:#ded4e1;
  font-size:18px;
  line-height:1.8;
  margin-bottom:35px;
}

.description b{
  color:#ff75b8;
}

/* Mission box */

.mission-box{
  border:1px dashed rgba(255,90,170,.7);
  border-radius:25px;
  padding:28px 15px;
  margin-bottom:40px;

  background:rgba(40,10,45,.55);
}

.puzzle{
  font-size:42px;
  margin-bottom:10px;
}

.mission-box h2{
  color:#ff86c1;
  margin-bottom:12px;
}

.mission-box p{
  color:#eee;
  font-size:19px;
  line-height:1.6;
}

/* Button */

.start-btn{
  width:100%;
  padding:21px;
  border:none;
  border-radius:50px;

  background:linear-gradient(
    135deg,
    #ff4f9d,
    #d91969
  );

  color:white;
  font-size:20px;
  font-weight:bold;
  letter-spacing:1px;

  cursor:pointer;

  box-shadow:
    0 0 20px rgba(255,30,130,.7),
    0 10px 40px rgba(180,0,90,.45);

  transition:.3s;
}

.start-btn:active{
  transform:scale(.96);
}

.start-btn:hover{
  transform:translateY(-3px);
  box-shadow:
    0 0 35px rgba(255,40,150,.9),
    0 15px 50px rgba(180,0,90,.6);
}

/* Bottom */

.secret{
  margin-top:35px;
  color:#c9bfd1;
  font-size:16px;
}

.ready{
  text-align:center;
  margin-bottom:50px;
  font-size:20px;
  color:#ddd;
}

.ready span{
  color:#ff5ca8;
}

</style>
</head>

<body>

<div class="top-text">
  <span>♡</span>
  SOMETHING SPECIAL AWAITS YOU
  <span>♡</span>
</div>

<div class="card">

  <div class="lock-box">
    🔐
  </div>

  <h1>A Secret</h1>

  <div class="mission-title">
    Mission
  </div>

  <div class="divider">
    ─── ♡ ───
  </div>

  <div class="description">
    Aaj kuch <b>ordinary</b> nahi hone wala...<br>
    Lekin aagay barhne ke liye<br>
    tumhein kuch <b>raaz</b> solve karne honge.
  </div>

  <div class="mission-box">

    <div class="puzzle">🧩</div>

    <h2>MISSION:</h2>

    <p>
      Solve it together.<br>
      Unlock the secret.
    </p>

  </div>

  <button class="start-btn" onclick="startMission()">
    START THE MISSION 🚀
  </button>

  <div class="secret">
    🔐 The secret is waiting for you... ✨
  </div>

</div>

<div class="ready">
  ✦ ─── Are you ready? <span>💕</span> ─── ✦
</div>

<script>

function startMission(){
  alert("Mission started 😏🔥");
}

</script>

</body>
</html>
